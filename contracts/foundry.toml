[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = []
solc_version = "0.8.28"
# Paris keeps the bytecode free of newer opcodes, the safest choice for a young chain like Arc.
evm_version = "paris"
optimizer = true
optimizer_runs = 200

[fuzz]
runs = 512

[rpc_endpoints]
arc_testnet = "https://rpc.testnet.arc.io"
